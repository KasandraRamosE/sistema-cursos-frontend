# ============================================================
# nginx.conf — Configuración para Vue 3 con Vue Router
# Ubicación: sistema-cursos-fhce/frontend/nginx.conf
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CRÍTICO para Vue Router (modo history):
    # Si el archivo no existe, sirve index.html
    # Sin esto, al recargar una página como /admin/cursos obtenés 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso hacia el backend Spring Boot
    # El frontend hace peticiones a /api/... y Nginx las redirige al backend
    # Así el navegador solo habla con un servidor (sin problemas de CORS)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache para assets estáticos (JS, CSS, imágenes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
